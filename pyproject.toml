[project]
name = "mfp-connector"
version = "0.1.0"
description = "Read-only MyFitnessPal diary/weight sync into SQLite, served over MCP"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tzdata",
    "mcp>=2.3,<3",
    "numpy>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mfp_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
